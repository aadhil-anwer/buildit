<!doctype html>
<html>
  <body style="margin:0;padding:32px 24px;background:#f3f2f2;color:#201f1d;font-family:Georgia,'Times New Roman',serif">
    <div style="max-width:420px;margin:0 auto">
      <p style="margin:0 0 24px;font-size:26px">BuildIt</p>
      <p style="margin:0 0 12px;font-size:16px;line-height:1.5">Your sign-in code is</p>
      <p style="margin:0 0 20px;font-size:40px;letter-spacing:6px;color:#7d5411">{{ .Token }}</p>
      <p style="margin:0 0 28px;font-size:14px;line-height:1.55;color:#605d5d">Type it in the app to sign in. It works once and expires shortly. If you didn't ask for it, ignore this email.</p>
      <hr style="border:0;border-top:1px solid #d7d3d3;margin:0 0 20px">
      <p dir="rtl" style="margin:0 0 8px;font-size:15px;line-height:1.8">رمز الدخول الخاص بك: <span style="font-size:22px;letter-spacing:3px;color:#7d5411">{{ .Token }}</span></p>
      <p dir="rtl" style="margin:0;font-size:13px;line-height:1.8;color:#605d5d">اكتب الرمز في التطبيق لتسجيل الدخول. يعمل مرة واحدة وتنتهي صلاحيته قريبًا. إن لم تطلبه فتجاهل هذه الرسالة.</p>
    </div>
  </body>
</html>
